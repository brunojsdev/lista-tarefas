<!doctype html>
<!--
  ==========================================================================
  ÍNDICE DO ARQUIVO (HTML)
  1. CONFIGURAÇÕES E METADADOS (<head>)
  2. NAVEGAÇÃO EXTERNA (Botão Voltar)
  3. FUNDO INTERATIVO (Canvas)
  4. CONTROLES DE INTERFACE (Tema)
  5. APLICAÇÃO PRINCIPAL (Wrapper e Input)
  6. CONTAINER DE TAREFAS (Injeção Dinâmica)
  7. RODAPÉ E SCRIPTS 
  ==========================================================================
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Tarefas</title>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="./img/fi-port.png" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Link para o CSS Externo -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 2. NAVEGAÇÃO EXTERNA: Link para retorno ao hub principal -->
    <a
      href="https://brunojsilveira.vercel.app/#projects"
      class="back-portfolio-btn"
    >
      <i
        data-lucide="arrow-big-left-dash"
        style="width: 24px; height: 24px"
      ></i>
      <span>Voltar ao Portfolio</span>
    </a>

    <!-- 3. FUNDO INTERATIVO: Camada para animação de partículas -->
    <canvas id="bg-canvas"></canvas>

    <!-- 4. CONTROLES DE INTERFACE: Botão para troca de tema (claro/escuro) -->
    <button
      id="theme-toggle-btn"
      class="theme-toggle-btn"
      title="Alternar Modo Claro/Escuro"
    >
      <i data-lucide="star" class="img-dark-mode"></i>
      <i data-lucide="star-off" class="img-light-mode"></i>
    </button>

    <!-- 5. APLICAÇÃO PRINCIPAL: Estrutura da To-Do List -->
    <main class="app-wrapper">
      <header class="header-section">
        <h1>Lista de Tarefas</h1>
        <p id="task-counter">Sistema pronto para novas tarefas</p>
      </header>

      <!-- Área de entrada de dados -->
      <section class="input-group">
        <input
          type="text"
          id="new-task-input"
          placeholder="Escreva uma nova tarefa!"
          maxlength="100"
        />
        <button id="btn-add-task">Adicionar</button>
      </section>

      <!-- 6. CONTAINER DE TAREFAS: Onde as linhas de tarefas são injetadas via JS -->
      <section class="todo-list" id="main-todo-list">
        <!-- Tasks will be injected here via JavaScript -->
      </section>
    </main>

    <!-- 7. RODAPÉ E SCRIPTS -->
    <footer>
      &copy; 2026 Bruno J. Silveira. Todos os direitos reservados.
    </footer>

    <!-- Lógica de manipulação de tarefas e animações -->
    <script src="script.js"></script>
  </body>
</html>
