<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Ícone da aba do navegador -->
    <link rel="icon" type="image/png" href="./img/fi-port.png">
    
    <!-- Link para o CSS Externo -->
    <link rel="stylesheet" href="style.css">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script></head>
    
</head>
<body>

    <!-- Botão Voltar ao Portfolio -->
    <a href="https://brunojsilveira.vercel.app/" 
    onclick="window.close();" 
    class="back-portfolio-btn">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-big-left">
    <path d="M18 15h-6v4l-7-7 7-7v4h6v6z"/>
    </svg>
    Voltar ao Portfolio
    </a>
    
    <!-- Background Animation Canvas -->
    <canvas id="bg-canvas"></canvas>

    <!-- Main Application Container -->
    <main class="app-wrapper">
        
        <header class="header-section">
            <h1>Lista de Tarefas</h1>
            <p id="task-counter">Sistema pronto para novas tarefas</p>
        </header>

        <section class="input-group">
            <input type="text" id="new-task-input" placeholder="Escreva uma nova tarefa  (•‿•) " maxlength="50">
            <button id="btn-add-task">Adicionar</button>
        </section>

        <section class="todo-list" id="main-todo-list">
            <!-- Tasks will be injected here via JavaScript -->
        </section>

    </main>

    <!-- Link para o JavaScript Externo -->
    <script src="script.js"></script>
</body>
</html>
