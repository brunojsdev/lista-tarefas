<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas | Bruno Silveira</title>
    <link rel="icon" type="image/png" href="img/favicon-todo.png">
    <link rel="stylesheet" href="lista_tarefas.css">
</head>
<body>
    <div class="container">
        <center>
            <h2>Minhas Tarefas</h2>
        </center>
        
        <div class="todo-card">
            <div class="input-group">
                <input type="text" id="todo-input" placeholder="O que preciso fazer?">
                <button class="add-btn" onclick="addTodo()">+</button>
            </div>

            <ul id="todo-list">
                <!-- Exemplo Inicial -->
                <li>
                    <span class="text">Escreva novas tarefas :)</span>
                    <div class="actions">
                        <span class="check" onclick="toggleTask(this)">✔</span>
                        <span class="del" onclick="deleteTask(this)">✖</span>
                    </div>
                </li>
            </ul>
        </div>

        <center>
            <a href="index.html" class="btn-voltar">← Voltar ao Início</a>
        </center>
    </div>

    <script src="lista_tarefas.js"></script>
</body>
</html>
